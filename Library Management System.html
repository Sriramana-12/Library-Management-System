<!DOCTYPE html>
<html lang="en">
<head>

<title>Library Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--silver);font:500 17px/1.5 Rajdhani,"Segoe UI",system-ui,sans-serif;background-image:radial-gradient(900px 620px at 78% 28%,rgba(212,21,20,.16),transparent 62%)}
h1,h2{margin:0;font-family:Orbitron,"Segoe UI",system-ui,sans-serif}
.top{display:flex;align-items:center;gap:28px;padding:22px 40px}
.brand{font:700 14px Orbitron,sans-serif;letter-spacing:.24em;display:flex;align-items:center;gap:10px}
.brand::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}
.links{display:flex;gap:36px;margin:0 auto}
.links button{background:none;border:0;border-bottom:1px solid transparent;color:var(--silver);font:600 11px Orbitron,sans-serif;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;padding:6px 0}
.links button:hover{border-color:var(--red)}
.pill{font:600 11px Orbitron,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--silver);background:transparent;border:1px solid var(--red);border-radius:999px;padding:12px 24px;cursor:pointer;transition:background .15s,color .15s}
.pill:hover{background:var(--red);color:#fff}
.hero{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:20px;padding:20px 40px 36px;min-height:calc(100vh - 90px)}
.tags{border-left:2px solid var(--red);padding-left:12px;font:500 11px/1.75 Orbitron,sans-serif;letter-spacing:.32em;color:var(--dim);margin-bottom:34px;width:fit-content}
.big{font-weight:700;font-size:clamp(32px,5vw,66px);line-height:1.04;letter-spacing:.01em}
.big em{font-style:normal;color:var(--red)}
.sub{font:500 12px/1.9 Orbitron,sans-serif;letter-spacing:.28em;color:var(--dim);margin:28px 0 34px;max-width:400px;text-transform:uppercase}
.hero .pill{padding:16px 36px}
.foot{display:flex;gap:18px;margin-top:64px;font:500 10px Orbitron,sans-serif;letter-spacing:.26em;color:var(--dim)}
.foot span+span{border-left:1px solid var(--line);padding-left:18px}
.stage{position:relative;height:min(560px,62vw);perspective:1100px;display:grid;place-items:center;--rx:-12deg;--ry:20deg}
.arc{position:absolute;width:88%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(212,21,20,.55);box-shadow:0 0 90px rgba(212,21,20,.22) inset}
.arc.b{width:104%;border-color:rgba(212,21,20,.22);box-shadow:none}
.orb{position:relative;width:58%;aspect-ratio:1;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s ease-out}
.core{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 32% 26%,#CDCBCA 0,#8d8b8a 5%,#2a0606 28%,#D41514 54%,#080808 80%);box-shadow:0 0 70px rgba(212,21,20,.5),inset -24px -24px 56px rgba(0,0,0,.85)}
.ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--silver);transform-style:preserve-3d;animation:r1 16s linear infinite}
.ring.r2{inset:-7%;border:2px solid var(--red);animation:r2 22s linear infinite}
.ring.r3{inset:7%;border:2px solid rgba(205,203,202,.45);animation:r3 12s linear infinite}
@keyframes r1{from{transform:rotateY(72deg) rotateZ(0)}to{transform:rotateY(72deg) rotateZ(360deg)}}
@keyframes r2{from{transform:rotateX(76deg) rotateZ(0)}to{transform:rotateX(76deg) rotateZ(-360deg)}}
@keyframes r3{from{transform:rotateX(24deg) rotateY(0)}to{transform:rotateX(24deg) rotateY(360deg)}}
.desk{padding:36px 40px 70px;border-top:1px solid var(--line)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.kpi div{border:1px solid var(--line);background:var(--panel);padding:16px 18px;border-radius:14px}
.kpi b{display:block;font:700 26px Orbitron,sans-serif}
.kpi span{font:500 10px Orbitron,sans-serif;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.kpi .hot{border-color:rgba(212,21,20,.6)}.kpi .hot b{color:var(--red)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.tabs button{flex:none;background:transparent;border:1px solid var(--line);color:var(--silver);border-radius:999px;padding:8px 16px;font:600 11px Orbitron,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.tabs button:hover{border-color:var(--red)}
.tabs button.on{border-color:var(--red);background:var(--red);color:#fff}
.tabs small{margin-left:8px;opacity:.75;font:600 12px Rajdhani,sans-serif}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0 18px}
.bar h2{font-size:22px;letter-spacing:.12em;text-transform:uppercase;margin-right:auto}
input,select{font:500 16px Rajdhani,sans-serif;color:var(--silver);background:#0a0a0a;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
input[type=search]{border-radius:999px;padding:9px 20px;min-width:240px}
option{background:#0e0e0e}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn{font:600 11px Orbitron,sans-serif;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);background:transparent;color:var(--silver);padding:11px 20px;border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--red)}
.btn.p{border-color:var(--red);background:var(--red);color:#fff}
.btn.p:hover{background:#b11110}
.btn.d{color:var(--red);border-color:rgba(212,21,20,.5)}
.btn.s{padding:6px 13px;font-size:10px}
form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
label{display:flex;flex-direction:column;gap:6px;font:600 10px Orbitron,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
label input,label select{width:100%;font:500 16px Rajdhani,sans-serif;letter-spacing:0;text-transform:none;color:var(--silver)}
.acts{display:flex;gap:10px;margin-top:20px}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 10px Orbitron,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
tr:hover td{background:rgba(212,21,20,.07)}
tr:last-child td{border-bottom:0}
td.a{display:flex;gap:6px}
.empty{padding:40px;color:var(--dim);text-align:center}
.tag{display:inline-block;padding:1px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px}
.tag.bad{color:var(--red);border-color:var(--red)}

#toast.show{opacity:1}
.avail{padding:36px 40px 10px;border-top:1px solid var(--line)}
.avail h2{font-size:22px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}
.avail input{width:100%;max-width:560px;padding:12px 22px;border-radius:999px}
#ares{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:20px}

.av{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}

.av h3{margin:0;font:600 15px Orbitron,sans-serif;letter-spacing:.06em}

.av .n{text-align:right;flex:none}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)}
function lbl(en,id){if(!id)return '–';const r=find(en,id);if(!r)return id+' (missing)';const l=E[en].l;return l?r[l]+' ('+id+')':id}
const calc={
 book:{Copies:r=>{const c=S.d.copy.filter(x=>x.isbn===r.isbn);return c.filter(x=>x.status==='Available').length+' of '+c.length+' available'}},
 member:{'Open loans':r=>S.d.issue.filter(x=>x.member_id===r.id&&x.status!=='Returned').length}
};
function nav(){document.getElementById('nav').innerHTML=ORDER.map(e=>`<button data-a="nav" data-e="${e}" class="${e===cur?'on':''}">${E[e].n}<small>${S.d[e].length}</small></button>`).join('')}
function input(f,v){
 const n=`name="${f.k}"`;
 if(f.t==='s')return `<select ${n}>${f.x.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
 if(f.t==='f')return `<select ${n} required><option value="">Choose…</option>${S.d[f.x].map(r=>`<option value="${esc(r[pk(f.x)])}" ${r[pk(f.x)]===v?'selected':''}>${esc(lbl(f.x,r[pk(f.x)]))}</option>`).join('')}</select>`;
 return `<input ${n} type="${f.t==='n'?'number':f.t==='d'?'date':'text'}" ${f.t==='n'?'step="any"':''} value="${esc(v)}" ${f.k==='isbn'||f.k==='name'||f.k==='title'?'required':''}>`;
}
function defaults(en){const r={};E[en].f.forEach(f=>{r[f.k]=f.t==='s'?f.x[0]:f.t==='d'?(f.k==='due_date'?today(14):['dob','return_date','pay_date','expiry'].includes(f.k)?'':today()):''});return r}
function form(){
 const en=cur,isNew=edit==='new',r=isNew?defaults(en):find(en,edit);if(!r){edit=null;return ''}
 return `<form id="f" data-id="${isNew?'':esc(edit)}"><div class="grid">${E[en].f.map(f=>`<label>${f.l}${input(f,r[f.k]).replace('required',f.k==='isbn'&&!isNew?'readonly':'required')}</label>`).join('')}</div><div class="acts"><button class="btn p">${isNew?'Add':'Save changes'}</button><button type="button" class="btn" data-a="cancel">Cancel</button></div></form>`;
}
function cell(en,f,v){
 if(f.t==='f')return esc(lbl(f.x,v));
 if(f.k==='status'||f.k==='paid'){const bad=(v==='Overdue'||v==='Unpaid'||v==='Lost'||v==='Damaged');return `<span class="tag ${bad?'bad':''}">${esc(v)}</span>`}
 return esc(v);
}
function table(){
 const en=cur,e=E[en],k=pk(en),cs=calc[en]||{};
 const rows=S.d[en].filter(r=>!q||JSON.stringify(Object.values(r)).toLowerCase().includes(q));
 if(!rows.length)return `<div class="wrap"><div class="empty">${S.d[en].length?'No records match your search.':'No '+e.n.toLowerCase()+' yet. Use Add to create the first one.'}</div></div>`;
 const head=(en==='book'?'':'<th>ID</th>')+e.f.map(f=>`<th>${f.l}</th>`).join('')+Object.keys(cs).map(c=>`<th>${c}</th>`).join('')+'<th></th>';
 const body=rows.map(r=>{
  const od=en==='issue'&&r.status==='Issued'&&r.due_date<today();
  return `<tr>${en==='book'?'':`<td>${esc(r.id)}</td>`}${e.f.map(f=>`<td>${cell(en,f,f.k==='status'&&od?'Overdue':r[f.k])}</td>`).join('')}${Object.values(cs).map(fn=>`<td>${fn(r)}</td>`).join('')}<td class="a">${en==='issue'&&r.status!=='Returned'?`<button class="btn s p" data-a="ret" data-id="${esc(r.id)}">Mark returned</button>`:''}${en==='fine'&&r.paid==='Unpaid'?`<button class="btn s p" data-a="pay" data-id="${esc(r.id)}">Mark paid</button>`:''}<button class="btn s" data-a="edit" data-id="${esc(r[k])}">Edit</button><button class="btn s d" data-a="del" data-id="${esc(r[k])}">Delete</button></td></tr>`}).join('');
 return `<div class="wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function avail(){
 const el=document.getElementById('ares');if(!el)return;
 const k=(document.getElementById('aq').value||'').trim().toLowerCase();
 if(!k){el.innerHTML='<div class="empty">Type a title, author, ISBN or shelf to see copies, borrowers and due dates.</div>';return}
 const au=id=>S.d.book_author.filter(x=>x.isbn===id).map(x=>(find('author',x.author_id)||{}).name||'').join(', ');
 const bs=S.d.book.filter(b=>(b.title+' '+b.isbn+' '+b.shelf+' '+au(b.isbn)).toLowerCase().includes(k)).slice(0,8);
 if(!bs.length){el.innerHTML='<div class="empty">No book matches that search.</div>';return}
 const t=today();
 el.innerHTML=bs.map(b=>{
  const cs=S.d.copy.filter(c=>c.isbn===b.isbn),n=cs.filter(c=>c.status==='Available').length,rs=S.d.reservation.filter(r=>r.isbn===b.isbn&&r.status==='Pending').length;
  const rows=cs.map(c=>{const i=S.d.issue.find(x=>x.copy_id===c.id&&x.status!=='Returned');let w='';
   if(c.status==='Issued'&&i){const m=find('member',i.member_id);w='With '+esc(m?m.name:i.member_id)+', due '+esc(i.due_date)+(i.due_date<t?' <b class="od">overdue</b>':'')}
   else if(c.status==='Available')w='On the shelf at '+esc(b.shelf);
   return `<li><span>${esc(c.id)}</span><span class="tag ${c.status==='Lost'||c.status==='Damaged'?'bad':''}">${esc(c.status)}</span><span>${w}</span></li>`}).join('');
  return `<article class="av"><header><div><h3>${esc(b.title)}</h3><p>${esc(au(b.isbn))}. ISBN ${esc(b.isbn)}. Shelf ${esc(b.shelf)}.</p></div><div class="n ${n?'':'out'}"><b>${n}</b><span>of ${cs.length} available</span></div></header>${cs.length?`<ul>${rows}</ul>`:'<p class="none">No copies recorded for this title.</p>'}${rs?`<p class="none">${rs} pending reservation${rs>1?'s':''}</p>`:''}</article>`}).join('');
}
function kpi(){const t=today(),i=S.d.issue.filter(x=>x.status==='Issued'),od=i.filter(x=>x.due_date<t).length,fn=S.d.fine.filter(x=>x.paid==='Unpaid').reduce((a,x)=>a+Number(x.amount||0),0),av=S.d.copy.filter(x=>x.status==='Available').length;
 const k=[['Titles',S.d.book.length],['Copies available',av+' / '+S.d.copy.length],['Active members',S.d.member.filter(m=>m.status==='Active').length],['Open loans',i.length],['Overdue',od,od>0],['Unpaid fines',fn,fn>0]];
 document.getElementById('kpi').innerHTML=k.map(x=>`<div class="${x[2]?'hot':''}"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}
function render(){
 nav();kpi();avail();const e=E[cur];
 document.getElementById('view').innerHTML=`<div class="bar"><h2>${e.n}</h2><input id="q" type="search" placeholder="Search ${e.n.toLowerCase()}" value="${esc(q)}" aria-label="Search"><button class="btn p" data-a="add">Add ${e.n.replace(/s$/,'').toLowerCase()}</button></div>${form()}<div id="tbl">${table()}</div>`;
}
function used(en,id){for(const o of ORDER)for(const f of E[o].f)if(f.t==='f'&&f.x===en&&S.d[o].some(r=>r[f.k]===id))return E[o].n;return null}
function doReturn(id){
 const i=find('issue',id);if(!i)return;const t=today();
 const late=Math.max(0,Math.round((new Date(t)-new Date(i.due_date))/864e5)),fine=late*2;
 i.return_date=t;i.status='Returned';const c=find('copy',i.copy_id);if(c)c.status='Available';
 add('return',{issue_id:id,return_date:t,condition:'Good',fine});
 if(fine>0)add('fine',{member_id:i.member_id,issue_id:id,amount:fine,reason:'Late',paid:'Unpaid',pay_date:''});
 save();render();toast(fine?`Returned. Late fine of ${fine} recorded.`:'Returned on time.');
}
document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 if(a==='av'){document.getElementById('avail').scrollIntoView({behavior:'smooth'});document.getElementById('aq').focus({preventScroll:true})}
 else if(a==='nav'){cur=b.dataset.e;edit=null;q='';render();if(b.dataset.s)document.getElementById('desk').scrollIntoView({behavior:'smooth'})}
 else if(a==='add'){edit='new';render();document.querySelector('#f input,#f select')?.focus()}
 else if(a==='edit'){edit=id;render();document.getElementById('f')?.scrollIntoView({block:'nearest'})}
 else if(a==='cancel'){edit=null;render()}
 else if(a==='ret')doReturn(id);
 else if(a==='pay'){const r=find('fine',id);r.paid='Paid';r.pay_date=today();save();render();toast('Fine marked as paid.')}
 else if(a==='del'){
  const u=used(cur,id);if(u){toast('Cannot delete: still used in '+u+'.');return}
  if(!confirm('Delete this record?'))return;
  S.d[cur]=S.d[cur].filter(r=>r[pk(cur)]!==id);save();render();toast('Deleted.');
 }
});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){q=ev.target.value.toLowerCase();document.getElementById('tbl').innerHTML=table()}});
document.addEventListener('submit',ev=>{
 ev.preventDefault();const en=cur,fd=new FormData(ev.target),id=ev.target.dataset.id,row={};
 E[en].f.forEach(f=>{let v=fd.get(f.k)??'';if(f.t==='n'&&v!=='')v=Number(v);row[f.k]=v});
 if(id){Object.assign(find(en,id),row);toast('Changes saved.')}
 else{
  if(en==='book'&&find('book',row.isbn)){toast('A book with this ISBN already exists.');return}
  if(en==='issue'){const c=find('copy',row.copy_id);if(c.status!=='Available'){toast('That copy is not available to issue.');return}c.status='Issued'}
  add(en,row);toast('Added.');
 }
 edit=null;save();render();
});
document.addEventListener('input',ev=>{if(ev.target.id==='aq')avail()});
(()=>{const st=document.getElementById('stage');if(!st||!matchMedia('(hover:hover)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
document.addEventListener('mousemove',ev=>{const x=ev.clientX/innerWidth-.5,y=ev.clientY/innerHeight-.5;st.style.setProperty('--rx',(-12-y*18).toFixed(1)+'deg');st.style.setProperty('--ry',(20+x*30).toFixed(1)+'deg')})})();
S=load();if(!S)seed();render();
</script>
